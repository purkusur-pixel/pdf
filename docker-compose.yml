# PDF Araçları — tek, küçük konteyner / one small container
# Ayarlar .env dosyasından okunur / settings are read from .env
services:
  pdf:
    build: .
    image: pdf-araclari:latest
    container_name: pdf-araclari
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-pdf.sporyazilimlari.com.tr}   # kurulum.sh ayarlar / set by kurulum.sh
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL .env dosyasinda olmali / must be set in .env}
      GOMEMLIMIT: 40MiB        # düşük bellek / keep Go memory low
      GOMAXPROCS: "1"
    ports:
      - "${HTTP_PORT:-80}:80"            # HTTP → HTTPS + sertifika doğrulama / cert validation
      - "${HTTPS_PORT:-443}:443"         # HTTPS
      - "${HTTPS_PORT:-443}:443/udp"     # HTTP/3
    volumes:
      - caddy_data:/data       # SSL sertifikaları — silme / certificates — keep
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:size=8m
    security_opt:
      - no-new-privileges:true
    mem_limit: 96m
    memswap_limit: 96m
    cpus: 0.5
    pids_limit: 50
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"

volumes:
  caddy_data:
  caddy_config:
